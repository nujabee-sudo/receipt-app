<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 토끼가 영수증을 먹는 아이콘 -->
  <rect width="512" height="512" fill="#2445a8"/>
  <g id="bunny" stroke="#16204a" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- 귀 -->
    <ellipse cx="196" cy="128" rx="38" ry="96" transform="rotate(-14 196 128)" fill="#ffffff"/>
    <ellipse cx="316" cy="128" rx="38" ry="96" transform="rotate(14 316 128)" fill="#ffffff"/>
    <ellipse cx="198" cy="138" rx="15" ry="62" transform="rotate(-14 198 138)" fill="#f7b3c6" stroke="none"/>
    <ellipse cx="314" cy="138" rx="15" ry="62" transform="rotate(14 314 138)" fill="#f7b3c6" stroke="none"/>
    <!-- 얼굴 -->
    <ellipse cx="256" cy="286" rx="124" ry="104" fill="#ffffff"/>
    <!-- 볼 -->
    <circle cx="176" cy="312" r="18" fill="#f7b3c6" stroke="none"/>
    <circle cx="336" cy="312" r="18" fill="#f7b3c6" stroke="none"/>
    <!-- 신나서 감은 눈 -->
    <path d="M190 276q18-22 36 0M286 276q18-22 36 0" fill="none"/>
    <!-- 코 -->
    <path d="M244 300h24l-12 11z" fill="#f28aa8" stroke-width="7"/>
    <!-- 입 (영수증이 들어가는 곳) -->
    <ellipse cx="256" cy="338" rx="30" ry="13" fill="#16204a"/>
    <!-- 영수증 -->
    <g transform="rotate(-9 256 400)">
      <path d="M200 334h112v120l-9.3 12-9.3-12-9.3 12-9.3-12-9.3 12-9.3-12-9.3 12-9.3-12-9.3 12-9.3-12-9.3 12-9.3-12-9.3 12V334z" fill="#fff6e0"/>
      <rect x="218" y="370" width="60" height="9" rx="4.5" fill="#c8b98f" stroke="none"/>
      <rect x="218" y="390" width="76" height="9" rx="4.5" fill="#c8b98f" stroke="none"/>
      <rect x="218" y="418" width="76" height="16" rx="6" fill="#2445a8" stroke="none"/>
    </g>
    <!-- 앞니 -->
    <rect x="240" y="322" width="16" height="22" rx="4" fill="#ffffff" stroke-width="7"/>
    <rect x="256" y="322" width="16" height="22" rx="4" fill="#ffffff" stroke-width="7"/>
    <!-- 영수증을 쥔 앞발 -->
    <ellipse cx="204" cy="412" rx="24" ry="19" transform="rotate(-20 204 412)" fill="#ffffff"/>
    <ellipse cx="310" cy="400" rx="24" ry="19" transform="rotate(20 310 400)" fill="#ffffff"/>
    <!-- 영수증 부스러기 -->
    <rect x="358" y="366" width="20" height="14" rx="3" transform="rotate(32 368 373)" fill="#fff6e0" stroke-width="6"/>
    <rect x="388" y="334" width="12" height="10" rx="2" transform="rotate(-22 394 339)" fill="#fff6e0" stroke-width="5"/>
    <rect x="124" y="376" width="16" height="12" rx="2.5" transform="rotate(-34 132 382)" fill="#fff6e0" stroke-width="5"/>
  </g>
</svg>
